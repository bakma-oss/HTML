<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>오목한 삼각형 각도 실험</title>
<style>
  :root{
    --bg:#fffdf2;
    --ink:#172033;
    --blue:#1468e8;
    --red:#e14b3b;
    --soft:#eef4ff;
    --line:#dce4ef;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    overscroll-behavior:none;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }
  header{
    padding:14px 16px 8px;
  }
  h1{
    margin:0 0 6px;
    font-size:22px;
  }
  .desc{
    margin:0;
    font-size:15px;
    line-height:1.45;
    color:#4b5565;
  }
  .panel{
    margin:8px 12px 10px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:16px;
    background:rgba(255,255,255,.82);
  }
  .formula{
    font-size:20px;
    font-weight:800;
    text-align:center;
  }
  .numbers{
    margin-top:7px;
    text-align:center;
    font-size:15px;
    line-height:1.55;
  }
  .ok{color:#0b7a43;font-weight:700}
  .stage-wrap{
    flex:1;
    min-height:420px;
    padding:0 10px 10px;
  }
  svg{
    width:100%;
    height:100%;
    min-height:420px;
    display:block;
    background:
      linear-gradient(to bottom, transparent 49px, rgba(217,190,90,.18) 50px, transparent 51px);
    background-size:100% 88px;
    border-radius:18px;
    touch-action:none;
  }
  .shape{
    fill:rgba(20,104,232,.045);
    stroke:var(--blue);
    stroke-width:5;
    stroke-linejoin:round;
  }
  .handle{
    fill:#fff;
    stroke:var(--blue);
    stroke-width:4;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.13));
  }
  .handle.active{fill:#dbeaff}
  .angle-arc{
    fill:none;
    stroke:var(--red);
    stroke-width:4;
    stroke-linecap:round;
  }
  .angle-label{
    font-size:28px;
    font-weight:800;
    fill:var(--ink);
    paint-order:stroke;
    stroke:var(--bg);
    stroke-width:7px;
    stroke-linejoin:round;
  }
  .angle-value{
    font-size:19px;
    font-weight:700;
    fill:var(--red);
    paint-order:stroke;
    stroke:var(--bg);
    stroke-width:6px;
  }
  .hint{
    position:fixed;
    left:50%;
    bottom:max(12px, env(safe-area-inset-bottom));
    transform:translateX(-50%);
    background:#172033;
    color:#fff;
    padding:8px 13px;
    border-radius:999px;
    font-size:13px;
    opacity:.92;
    pointer-events:none;
    white-space:nowrap;
  }
  button{
    display:block;
    margin:0 auto;
    border:0;
    background:var(--soft);
    color:#154c9f;
    font-weight:700;
    font-size:14px;
    padding:9px 14px;
    border-radius:12px;
  }
</style>
</head>
<body>
<header>
  <h1>각도 드래그 실험</h1>
  <p class="desc">파란 점을 손가락으로 끌어 보세요. 가운데 점을 위·아래로 움직이거나 바깥쪽으로 빼도 각도가 즉시 바뀝니다.</p>
</header>

<div class="panel">
  <div class="formula">a + b + c = ㄱ</div>
  <div class="numbers" id="numbers"></div>
  <button id="resetBtn">처음 모양으로</button>
</div>

<div class="stage-wrap">
<svg id="svg" viewBox="0 0 900 700" aria-label="드래그 가능한 각도 도형">
  <polygon id="poly" class="shape"></polygon>

  <path id="arcA" class="angle-arc"></path>
  <path id="arcB" class="angle-arc"></path>
  <path id="arcC" class="angle-arc"></path>
  <path id="arcD" class="angle-arc"></path>

  <text id="labelA" class="angle-label">a</text>
  <text id="labelB" class="angle-label">b</text>
  <text id="labelC" class="angle-label">c</text>
  <text id="labelD" class="angle-label">ㄱ</text>

  <text id="valueA" class="angle-value"></text>
  <text id="valueB" class="angle-value"></text>
  <text id="valueC" class="angle-value"></text>
  <text id="valueD" class="angle-value"></text>

  <circle id="pA" class="handle" r="15"></circle>
  <circle id="pB" class="handle" r="15"></circle>
  <circle id="pD" class="handle" r="15"></circle>
  <circle id="pC" class="handle" r="15"></circle>
</svg>
</div>

<div class="hint">● 파란 점을 손가락으로 드래그</div>

<script>
const svg = document.getElementById('svg');

const defaults = {
  A:{x:445,y:65},
  B:{x:95,y:610},
  D:{x:435,y:365},
  C:{x:820,y:600}
};
const P = JSON.parse(JSON.stringify(defaults));

const ids = {
  A:document.getElementById('pA'),
  B:document.getElementById('pB'),
  C:document.getElementById('pC'),
  D:document.getElementById('pD')
};

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function angleAt(prev, v, next){
  const ux=prev.x-v.x, uy=prev.y-v.y;
  const vx=next.x-v.x, vy=next.y-v.y;
  const dot=ux*vx+uy*vy;
  const m=Math.hypot(ux,uy)*Math.hypot(vx,vy);
  if(m===0) return 0;
  return Math.acos(Math.max(-1,Math.min(1,dot/m))) * 180/Math.PI;
}

function polygonArea(points){
  let s=0;
  for(let i=0;i<points.length;i++){
    const p=points[i], q=points[(i+1)%points.length];
    s += p.x*q.y-q.x*p.y;
  }
  return s/2;
}

function isConcaveVertex(prev, v, next, orientation){
  const ax=v.x-prev.x, ay=v.y-prev.y;
  const bx=next.x-v.x, by=next.y-v.y;
  const cross=ax*by-ay*bx;
  return orientation>0 ? cross<0 : cross>0;
}

function unit(vx,vy){
  const m=Math.hypot(vx,vy)||1;
  return {x:vx/m,y:vy/m};
}

function labelPos(prev,v,next,inside=true,extra=0){
  const u1=unit(prev.x-v.x, prev.y-v.y);
  const u2=unit(next.x-v.x, next.y-v.y);
  let bx=u1.x+u2.x, by=u1.y+u2.y;
  let m=Math.hypot(bx,by);
  if(m<0.05){ bx=-u1.y; by=u1.x; m=1; }
  bx/=m; by/=m;
  const r=55+extra;
  return {x:v.x+bx*r, y:v.y+by*r};
}

function arcPath(prev,v,next,r,reverse=false){
  const a1=Math.atan2(prev.y-v.y, prev.x-v.x);
  const a2=Math.atan2(next.y-v.y, next.x-v.x);
  let delta=a2-a1;
  while(delta<=-Math.PI) delta+=Math.PI*2;
  while(delta>Math.PI) delta-=Math.PI*2;
  if(reverse){
    delta = delta>0 ? delta-Math.PI*2 : delta+Math.PI*2;
  }
  const end=a1+delta;
  const sx=v.x+r*Math.cos(a1), sy=v.y+r*Math.sin(a1);
  const ex=v.x+r*Math.cos(end), ey=v.y+r*Math.sin(end);
  const large=Math.abs(delta)>Math.PI?1:0;
  const sweep=delta>0?1:0;
  return `M ${sx} ${sy} A ${r} ${r} 0 ${large} ${sweep} ${ex} ${ey}`;
}

function setText(id,pos,text,dy=0){
  const e=document.getElementById(id);
  e.setAttribute('x',pos.x);
  e.setAttribute('y',pos.y+dy);
  e.setAttribute('text-anchor','middle');
  e.setAttribute('dominant-baseline','middle');
  e.textContent=text;
}

function update(){
  const order=[P.A,P.B,P.D,P.C];
  document.getElementById('poly').setAttribute('points',
    order.map(p=>`${p.x},${p.y}`).join(' ')
  );

  for(const k of ['A','B','C','D']){
    ids[k].setAttribute('cx',P[k].x);
    ids[k].setAttribute('cy',P[k].y);
  }

  const area=polygonArea(order);
  const orient=area>=0?1:-1;

  const a=angleAt(P.B,P.A,P.C);
  const b=angleAt(P.A,P.B,P.D);
  const c=angleAt(P.D,P.C,P.A);

  const smallD=angleAt(P.B,P.D,P.C);
  const concave=isConcaveVertex(P.B,P.D,P.C,orient);
  const interiorD=concave ? 360-smallD : smallD;

  // ㄱ은 가운데 꼭짓점의 작은 각(그림에 표시한 각)
  const g=smallD;

  document.getElementById('arcA').setAttribute('d',arcPath(P.B,P.A,P.C,40,false));
  document.getElementById('arcB').setAttribute('d',arcPath(P.A,P.B,P.D,40,false));
  document.getElementById('arcC').setAttribute('d',arcPath(P.D,P.C,P.A,40,false));
  document.getElementById('arcD').setAttribute('d',arcPath(P.B,P.D,P.C,52,false));

  const la=labelPos(P.B,P.A,P.C,true,15);
  const lb=labelPos(P.A,P.B,P.D,true,15);
  const lc=labelPos(P.D,P.C,P.A,true,15);
  const ld=labelPos(P.B,P.D,P.C,true,20);

  setText('labelA',la,'a');
  setText('labelB',lb,'b');
  setText('labelC',lc,'c');
  setText('labelD',ld,'ㄱ');

  setText('valueA',{x:la.x,y:la.y+32},`${a.toFixed(1)}°`);
  setText('valueB',{x:lb.x,y:lb.y+32},`${b.toFixed(1)}°`);
  setText('valueC',{x:lc.x,y:lc.y+32},`${c.toFixed(1)}°`);
  setText('valueD',{x:ld.x,y:ld.y+32},`${g.toFixed(1)}°`);

  const sum=a+b+c;
  const diff=Math.abs(sum-g);
  const valid = concave && diff < 0.2;

  document.getElementById('numbers').innerHTML =
    `a = ${a.toFixed(1)}° &nbsp;&nbsp; b = ${b.toFixed(1)}° &nbsp;&nbsp; c = ${c.toFixed(1)}°<br>`+
    `a + b + c = <b>${sum.toFixed(1)}°</b> &nbsp;&nbsp; ㄱ = <b>${g.toFixed(1)}°</b><br>`+
    (valid
      ? `<span class="ok">✓ 현재 모양에서는 a + b + c = ㄱ</span>`
      : `가운데 점이 너무 바깥으로 나가면 오목한 모양이 아니어서 이 관계가 성립하지 않습니다.`);
}

function clientToSvg(e){
  const pt=svg.createSVGPoint();
  pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

let dragging=null;

for(const k of ['A','B','C','D']){
  const el=ids[k];
  el.addEventListener('pointerdown',e=>{
    dragging=k;
    el.classList.add('active');
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(dragging!==k) return;
    const p=clientToSvg(e);
    P[k].x=Math.max(25,Math.min(875,p.x));
    P[k].y=Math.max(25,Math.min(675,p.y));
    update();
    e.preventDefault();
  });
  const stop=e=>{
    if(dragging===k){
      dragging=null;
      el.classList.remove('active');
      try{el.releasePointerCapture(e.pointerId)}catch(_){}
    }
  };
  el.addEventListener('pointerup',stop);
  el.addEventListener('pointercancel',stop);
}

document.getElementById('resetBtn').addEventListener('click',()=>{
  for(const k of Object.keys(defaults)){
    P[k].x=defaults[k].x; P[k].y=defaults[k].y;
  }
  update();
});

update();
</script>
</body>
</html>
